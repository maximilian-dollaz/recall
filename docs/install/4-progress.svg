  <text x="16" y="106" font-size="13" fill="#3fb950" font-weight="700">[5 of 11] Downloading the AI models (about 9 GB; often 5 to 30 minutes)</text>
  <text x="16" y="126" font-size="13" fill="#ccc">    The progress bars below are the download. Leave the window open.</text>
