<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <rect width="640" height="300" fill="#eef1f5"/>
  <g transform="translate(40,24)">
    <rect width="92" height="56" rx="10" fill="#fff" stroke="#999" stroke-width="2"/><text x="46" y="36" font-size="20" text-anchor="middle">⌘ cmd</text>
    <text x="110" y="36" font-size="26" fill="#555">+</text>
    <rect x="140" width="240" height="56" rx="10" fill="#fff" stroke="#999" stroke-width="2"/><text x="260" y="36" font-size="20" text-anchor="middle">space bar</text>
    <text x="400" y="26" font-size="15" fill="#e5484d" font-weight="700">1. Hold ⌘, tap the</text><text x="400" y="46" font-size="15" fill="#e5484d" font-weight="700">space bar</text>
  </g>
  <rect x="100" y="110" width="440" height="52" rx="14" fill="#fff" stroke="#aaa"/>
  <text x="122" y="144" font-size="22" fill="#888">🔍</text><text x="160" y="145" font-size="22">Terminal</text>
  <text x="300" y="145" font-size="15" fill="#e5484d" font-weight="700">2. Type Terminal</text>
  <rect x="100" y="166" width="440" height="58" rx="10" fill="#2f6fde"/>
  <rect x="116" y="176" width="38" height="38" rx="8" fill="#222"/><text x="122" y="201" font-size="15" fill="#3c3" font-family="Menlo,Monaco,Consolas,monospace">&gt;_</text>
  <text x="168" y="201" font-size="18" fill="#fff">Terminal</text>
  <text x="150" y="262" font-size="17" fill="#e5484d" font-weight="700">3. Press Return. A window with text opens.</text>
</svg>
