name: install-mac
# Runs the one-line installer on a clean Apple Silicon Mac in GitHub's cloud, the way a new person would,
# then saves one note and finds it again. Runs when the installer changes, and on demand (Actions → Run workflow).
on:
  pull_request:
    paths: [get.sh, install.sh, uninstall.sh, check.sh, connect-ipad.sh, "server/**", "bin/**", "tools/ocr.py", ".github/workflows/install-mac.yml"]
  workflow_dispatch:

jobs:
  install:
    runs-on: macos-latest      # Apple Silicon
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: get.sh, sparse-checkout-cone-mode: false }

      - name: The Mac check, on its own (ready, tight, and too full)
        env: { RECALL_ALLOW_SMALL: "1" }
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/check.sh" -o check.sh
          bash check.sh
          RECALL_TEST_FREE_GB=30 bash check.sh | tee out.txt; grep -q "fairly full" out.txt
          set +e; RECALL_TEST_FREE_GB=12 bash check.sh > out.txt; code=$?; set -e
          cat out.txt; echo "exit code: $code"
          [ "$code" = 1 ] && grep -q "can't be installed" out.txt

      - name: Install, the way a new person does (no Homebrew on the PATH)
        env:
          RECALL_REF: ${{ github.head_ref || github.ref_name }}
          RECALL_NO_OPEN: "1"
          RECALL_ALLOW_SMALL: "1"   # the cloud Mac has 7 GB of memory
        run: env PATH=/usr/bin:/bin:/usr/sbin:/sbin bash get.sh

      - name: Run it again (must be safe to repeat)
        env: { RECALL_REF: "${{ github.head_ref || github.ref_name }}", RECALL_NO_OPEN: "1", RECALL_ALLOW_SMALL: "1" }
        run: env PATH=/usr/bin:/bin:/usr/sbin:/sbin bash get.sh

      - name: Text in pictures without Xcode's tools (the Python reader)
        run: |
          out=$(~/Recall/tools/.venv/bin/python ~/Recall/tools/ocr.py ~/Recall/app/static/onboard/mac-details.jpg)
          echo "$out" | head -5
          [ -n "$out" ]

      - name: iPad link pieces (QR code, library link) without a Tailscale account
        run: |
          zsh -n ~/Recall/connect-ipad.sh
          ~/Recall/tools/.venv/bin/python -c "import qrcode,sys; q=qrcode.QRCode(border=2); q.add_data(sys.argv[1]); q.print_ascii(invert=True)" https://example.ts.net | head -3
          echo '{"owner":"me@this-mac.local","people":{"me@this-mac.local":{"id":"sam","name":"Sam","source":"default"}}}' > p.json
          ~/.recall/env/bin/jq --arg l "sam@gmail.com" '.people[$l] = ((.people[$l] // {}) + {id: .people[.owner].id, name: .people[.owner].name, alias_of: .owner})' p.json | tee p2.json
          [ "$(~/.recall/env/bin/jq -r '.people["sam@gmail.com"].alias_of' p2.json)" = "me@this-mac.local" ]

      - name: Save a note and find it again
        run: |
          curl -sf -F "notes=Ceramic lamp with a warm amber glow, for the reading nook" http://127.0.0.1:3344/api/save
          for i in $(seq 1 120); do
            n=$(curl -s "http://127.0.0.1:3344/api/search?q=amber%20lamp" | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); r=d if isinstance(d,list) else (d.get("results") or d.get("hits") or d.get("items") or []); print(len(r))' 2>/dev/null || echo 0)
            [ "${n:-0}" -gt 0 ] && { echo "found it after $((i*10)) seconds"; exit 0; }
            sleep 10
          done
          echo "The note was not filed within 20 minutes"; tail -50 ~/.gbrain/serve/app.err; exit 1

      - name: Logs
        if: always()
        run: |
          tail -80 ~/.recall/logs/install.log || true
          for f in ~/.gbrain/serve/app.err ~/.gbrain/serve/serve.err ~/.recall/logs/ollama.err; do echo "== $f"; tail -40 "$f" 2>/dev/null || true; done
