<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add to Recall</title>
<style>
  :root { --bg:#171613; --paper:#201e1a; --fg:#ece7dd; --muted:#a59d8f; --line:#3a362f; --accent:#7fc3a2; --on-accent:#10261c; --red:#e0352b; color-scheme:dark }
  * { box-sizing:border-box }
  body { margin:0; width:400px; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system, system-ui, sans-serif; padding:16px; display:grid; gap:13px }
  .top { display:flex; gap:13px; align-items:flex-start }
  #thumb { width:72px; height:72px; border-radius:10px; object-fit:cover; background:var(--paper); flex:none }
  #thumb[hidden] { display:none }
  .prompt { font-weight:700; margin:0 } #what { color:var(--muted); font-size:.85rem; margin:3px 0 0; word-break:break-all; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
  #said { min-height:66px; max-height:340px; overflow-y:auto; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--paper); white-space:pre-wrap }
  #said.live { border-color:#fff; box-shadow:0 0 0 1px rgba(255,255,255,.9), 0 0 calc(6px + 18px * var(--vol, 0)) rgba(255,255,255,.35) }
  textarea { width:100%; min-height:66px; max-height:340px; overflow-y:auto; font:inherit; color:var(--fg); background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 12px; resize:none }
  .row { display:flex; gap:13px; align-items:center; justify-content:space-between }
  #stop { all:unset; cursor:pointer; width:52px; height:52px; border-radius:50%; background:var(--red); display:grid; place-items:center }
  #stop::after { content:""; width:18px; height:18px; border-radius:4px; background:#fff }
  #stop:disabled { opacity:.4; cursor:default }
  #savebtn { all:unset; cursor:pointer; padding:10px 18px; border-radius:12px; background:var(--accent); color:var(--on-accent); font-weight:700 }
  #savebtn:disabled { opacity:.5; cursor:default }
  #type { all:unset; cursor:pointer; color:var(--accent); text-decoration:underline; text-underline-offset:3px; font-size:.9rem }
  #status { color:var(--muted); font-size:.9rem } #status.ok { color:var(--accent); font-weight:700 } #status.err { color:#e07a7a }
  #many { display:flex; flex-wrap:wrap; gap:6px }
  #many img, #many span { width:44px; height:44px; border-radius:8px; object-fit:cover; background:var(--paper); border:1px solid var(--line) }
  #many span { display:grid; place-items:center; color:var(--muted); font-size:.8rem }
  .allow { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:9px 12px; border:1px solid var(--line); border-radius:12px; color:var(--muted); font-size:.85rem }
  #allowbtn { all:unset; cursor:pointer; padding:6px 12px; border-radius:10px; background:var(--accent); color:var(--on-accent); font-weight:700; flex:none }
  [hidden] { display:none !important }
</style>
</head>
<body>
  <div class="top"><img id="thumb" alt="" hidden><div><p class="prompt">What is this? What's it for, and why do you love it?</p><p id="what"></p></div></div>
  <div id="many" hidden></div>
  <div id="allow" class="allow" hidden><span>Allow Recall to read your Google files, so what's inside them is saved too.</span><button id="allowbtn">Allow</button></div>
  <div id="said" class="live"></div>
  <textarea id="typed" hidden></textarea>
  <div class="row"><button id="stop" aria-label="Done"></button><button id="savebtn" hidden>Save to Recall</button><span id="status"></span><button id="type">Type instead</button></div>
  <script src="capture.js"></script>
  <script src="recorder.js"></script>
</body>
</html>
